<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>
        FitBuddy | AI Fitness Planner
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body class="hero">

<main class="container narrow">

<section class="card">

<div class="brand">
    FITBUDDY
</div>

<h1>
    Build your 7-day fitness plan
</h1>

<p class="muted">
    AI-assisted workout planning with practical
    nutrition and recovery guidance.
</p>

{% if error %}

<div class="alert">
    {{ error }}
</div>

{% endif %}


<form
    action="/generate-workout"
    method="post"
    class="form-grid"
>

<label>
    Name

    <input
        name="username"
        required
        maxlength="120"
        placeholder="Your name"
    >
</label>


<label>
    User ID

    <input
        name="user_id"
        required
        maxlength="80"
        placeholder="e.g. FB001"
    >
</label>


<label>
    Age

    <input
        type="number"
        name="age"
        min="13"
        max="100"
        required
    >
</label>


<label>
    Weight (kg)

    <input
        type="number"
        name="weight"
        min="20"
        max="500"
        step="0.1"
        required
    >
</label>


<label>
    Fitness goal

    <select
        name="goal"
        required
    >

        <option value="weight loss">
            Weight loss
        </option>

        <option value="muscle gain">
            Muscle gain
        </option>

        <option value="general wellness">
            General wellness
        </option>

        <option value="flexibility">
            Flexibility
        </option>

        <option value="endurance">
            Endurance
        </option>

    </select>

</label>


<label>
    Workout intensity

    <select
        name="intensity"
        required
    >

        <option value="low">
            Low
        </option>

        <option
            value="medium"
            selected
        >
            Medium
        </option>

        <option value="high">
            High
        </option>

    </select>

</label>


<label>
    Experience

    <select
        name="experience_level"
    >

        <option
            value="beginner"
            selected
        >
            Beginner
        </option>

        <option value="intermediate">
            Intermediate
        </option>

        <option value="advanced">
            Advanced
        </option>

    </select>

</label>


<button
    type="submit"
    class="btn full"
>
    Generate 7-Day Plan
</button>

</form>


<p class="tiny">
    General wellness guidance only.
    Stop exercise if you feel unwell and seek
    professional advice when appropriate.
</p>

</section>

</main>

</body>
</html>
